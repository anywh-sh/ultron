<!doctype html>
<!-- `lang` covers the very first frame only; LocaleProvider rewrites it with
     the resolved locale as soon as React mounts. -->
<html lang="en" data-appearance="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale`/`user-scalable=no` evita o auto-zoom do WebKit ao
         focar um input com font-size < 16px (o composer usa ~14px) — sem
         isso, tocar no composer no iOS zoom a página inteira, exigindo
         scroll horizontal/vertical pra ver o resto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>anywh.sh</title>
    <script type="module" src="/src/main.tsx" defer></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
