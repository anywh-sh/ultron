[package]
name = "client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"

# Voz (ditado local) fora do escopo do MVP iOS (docs/22) — cpal/whisper-rs
# puxam símbolos de CoreAudio/Accelerate que não linkam no target iOS sem
# trabalho adicional. Desktop (Windows/macOS/Linux) continua com voz normal.
[target.'cfg(not(target_os = "ios"))'.dependencies]
cpal = "0.15"
whisper-rs = "0.16"
rubato = "0.15"

# Spike 2 (docs/22) - so para validar viabilidade de UI nativa SwiftUI/Liquid
# Glass ao lado do WKWebView. Throwaway, nao faz parte do escopo do MVP ainda.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-glass-spike = { path = "plugins/tauri-plugin-glass-spike" }

